<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Auto redirect -->
    <script>
        // Redirect langsung
        window.location.href = "https://dokumentasi.gt.tc/";

        // Fallback kalau lama (3 detik)
        setTimeout(function() {
            document.getElementById("fallback").style.display = "flex";
        }, 3000);
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1s ease forwards;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #00c6ff;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

    <div id="fallback">
        <h1>⚡ Koneksi lambat?</h1>
        <p>Tekan tombol di bawah untuk melanjutkan</p>
        <button onclick="window.location.href='https://dokumentasi.gt.tc/'">
            🚀 Tekan untuk Melanjutkan
        </button>
    </div>

</body>
</html>
